name: Publicar A Pérola dos Sete Ventos no GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/publicar-pages.yml'
      - 'index.html'
      - 'assets/**'
      - 'ficcao/**'
      - 'sobre/**'
      - '404.html'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar ficheiros
        run: |
          mkdir -p _site
          cp -a index.html 404.html .nojekyll ficcao sobre assets _site/
          test -s _site/assets/banner-v3.webp
          test -s _site/assets/reuniao-pre-tour.webp
          test -s _site/ficcao/cracfics/o-dia-em-que-ninguem-reconheceu-o-sol/index.html
          test -s _site/ficcao/cracfics/reuniao-pre-tour-dragoes-raizes-ramen-e-pinguins/index.html
      - name: Carregar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        name: Publicar site
        uses: actions/deploy-pages@v4
