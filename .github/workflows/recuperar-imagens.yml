name: Recuperar imagens do antigo site
on:
  push:
    paths:
      - '.github/workflows/recuperar-imagens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência de imagem
        run: python -m pip install --quiet pillow requests
      - name: Recuperar e integrar imagens originais
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import requests,sys

          out=Path("assets");out.mkdir(exist_ok=True)
          images = {
            "banner-v3.webp":("v3-banner-panoramico.png","WEBP"),
            "hero-esquerdo.webp":("v3-fundo-hero-esquerdo.png","WEBP"),
            "hero-direito.webp":("v3-fundo-hero-direito.png","WEBP"),
            "ornamento-sakuras.png":("v3-sakuras-transparente.png","PNG"),
            "arabesco-esquerdo.png":("v3-arabesco-menu-esquerdo.png","PNG"),
            "arabesco-direito.png":("v3-arabesco-menu-direito.png","PNG")
          }
          good=0;failed=[]
          for dest,(source,format) in images.items():
              for host in [
                 "https://perola7ventos.wordpress.com/wp-content/uploads/2026/11/",
                 "https://i0.wp.com/perola7ventos.wordpress.com/wp-content/uploads/2026/11/"
              ]:
                  try:
                      res=requests.get(host+source,timeout=20,headers={"User-Agent":"Mozilla/5.0"})
                      res.raise_for_status()
                      if not res.headers.get("Content-Type","").lower().startswith("image/"):raise ValueError("not an image")
                      img=Image.open(BytesIO(res.content));img.load()
                      if format=="WEBP":img.convert("RGB").save(out/dest,"WEBP",quality=78,method=6)
                      else:img.save(out/dest,"PNG",optimize=True)
                      print(f"OK {dest} via {host}");good+=1;break
                  except Exception as exc:
                      print(f"Source unavailable: {source} via {host}: {exc}")
              else:failed.append(source)
          print(f"Recovered {good} of {len(images)} files")
          if failed:
              print("Unavailable source images:",", ".join(failed))
          if good==0:sys.exit("Original media could not be recovered from WordPress CDN")
          PY
      - name: Guardar imagens no repositório
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "P0: recuperar imagens originais e tornar o site independente do WordPress"
            git push
          else
            echo "Sem alterações de imagens"
          fi
